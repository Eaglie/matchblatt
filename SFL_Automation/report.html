<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>ST.GALLEN &mdash; LUZERN</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f5f7; margin: 0; padding: 20px; color: #212529; display: flex; justify-content: center; }
        .sheet { width: 850px; background: #ffffff; border: 2px solid #1a365d; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .header { background-color: #1a365d; color: #ffffff; text-align: center; padding: 15px; }
        .header h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
        .header .sub-info { font-size: 13px; margin-top: 5px; color: #cbd5e1; }

        .team-section { border: 2px solid #1a365d; margin: 15px; border-radius: 4px; overflow: hidden; }
        .team-header { background-color: #1a365d; color: #ffffff; padding: 10px 15px; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .team-header span { font-size: 13px; font-weight: normal; color: #e2e8f0; }

        .content-grid { display: flex; padding: 15px; gap: 15px; background: #fff; }
        
        .pitch-box { flex: 2; border: 2px solid #cbd5e1; border-radius: 6px; padding: 15px; text-align: center; background: #fafbfc; min-height: 280px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 13px; }
        
        .tables-box { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; height: 20px; }
        th { background-color: #f1f5f9; font-weight: 600; color: #334155; width: 35%; }
        td { background-color: #ffffff; color: #1e293b; }
    </style>
</head>
<body>
    <div class="sheet">
        <div class="header">
            <h1>ST.GALLEN &mdash; LUZERN</h1>
            <div class="sub-info">Berit Sitterstadion &bull; Schiedsrichter: Schiedsrichter &bull; VAR: VAR</div>
        </div>

        <div class="team-section">
            <div class="team-header">
                ST.GALLEN
                <span>Letztes Spiel: Letztes Spiel</span>
            </div>
            <div class="content-grid">
                <div class="pitch-box">[Formation laden]</div>
                <div class="tables-box">
                    <table>
                        <tr><th>Gesperrt</th><td></td></tr>
                        <tr><th>Verletzt</th><td></td></tr>
                        <tr><th>Krank</th><td></td></tr>
                        <tr><th>Fraglich</th><td></td></tr>
                    </table>
                </div>
            </div>
        </div>

        <div class="team-section">
            <div class="team-header">
                LUZERN
                <span>Letztes Spiel: Letztes Spiel</span>
            </div>
            <div class="content-grid">
                <div class="pitch-box">[Formation laden]</div>
                <div class="tables-box">
                    <table>
                        <tr><th>Gesperrt</th><td></td></tr>
                        <tr><th>Verletzt</th><td></td></tr>
                        <tr><th>Krank</th><td></td></tr>
                        <tr><th>Fraglich</th><td></td></tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
